<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meme Stickers 表情包工坊 (API 版)</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">🎨</span>
        <div>
          <h1 class="brand-title">Meme Stickers 表情包工坊 (API 版)</h1>
          <p class="brand-sub">实时前端预览与轻量渲染服务工作台</p>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px;">
        <span id="backend-status-badge" class="badge" style="font-size: 13px;">检测服务状态中...</span>
      </div>
    </header>

    <!-- Playground Workshop -->
    <main id="tab-playground" class="tab-content active" style="display: block;">
      <div class="playground-grid">
        <!-- Controls Column -->
        <div class="controls-panel">
          <div class="card">
            <h2 class="card-title"><span>🏷️</span> 贴纸选择</h2>
            <div class="form-group">
              <label class="form-label" for="pack-select">贴纸包</label>
              <select id="pack-select" class="form-select">
                <option value="">正在加载贴纸包...</option>
              </select>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="category-select">分类 / 角色</label>
                <select id="category-select" class="form-select" disabled>
                  <option value="">请先选择贴纸包</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="sticker-select">贴纸名称</label>
                <select id="sticker-select" class="form-select" disabled>
                  <option value="">请选择贴纸</option>
                </select>
              </div>
            </div>
          </div>

          <div class="card">
            <h2 class="card-title"><span>✏️</span> 文字与排版配置</h2>
            
            <div class="form-group">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                <label class="form-label" style="margin: 0;" for="text-input">表情配文</label>
                <span style="font-size: 11px; color: var(--text-muted);">(Ctrl + Enter 快速生成)</span>
              </div>
              <textarea id="text-input" class="form-textarea" rows="2" placeholder="在此输入表情包要绘制的文字（支持换行）"></textarea>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="font-size-range">字号大小</label>
                <div class="range-wrap">
                  <input type="range" id="font-size-range" class="range-input" min="10" max="120" value="48" />
                  <span id="font-size-val" class="range-val">48px</span>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="stroke-width-range">描边粗细系数</label>
                <div class="range-wrap">
                  <input type="range" id="stroke-width-range" class="range-input" min="0" max="0.5" step="0.01" value="0.22" />
                  <span id="stroke-width-val" class="range-val">0.22</span>
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="text-x-input">X 坐标 (px)</label>
                <input type="number" id="text-x-input" class="form-input" placeholder="默认" />
              </div>
              <div class="form-group">
                <label class="form-label" for="text-y-input">Y 坐标 (px)</label>
                <input type="number" id="text-y-input" class="form-input" placeholder="默认" />
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="rotate-range">旋转角度</label>
                <div class="range-wrap">
                  <input type="range" id="rotate-range" class="range-input" min="-180" max="180" value="0" />
                  <span id="rotate-val" class="range-val">0°</span>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="text-align-select">对齐方式</label>
                <select id="text-align-select" class="form-select">
                  <option value="center" selected>居中 (Center)</option>
                  <option value="left">左对齐 (Left)</option>
                  <option value="right">右对齐 (Right)</option>
                </select>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label">文字颜色</label>
                <div class="color-picker-wrap">
                  <input type="color" id="text-color-picker" class="color-picker" value="#1a1a1a" />
                  <input type="text" id="text-color-hex" class="form-input" value="#1a1a1a" style="flex: 1;" />
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">描边颜色</label>
                <div class="color-picker-wrap">
                  <input type="color" id="stroke-color-picker" class="color-picker" value="#ffffff" />
                  <input type="text" id="stroke-color-hex" class="form-input" value="#ffffff" style="flex: 1;" />
                </div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="font-style-select">字体字重</label>
                <select id="font-style-select" class="form-select">
                  <option value="normal" selected>正常 (Normal)</option>
                  <option value="bold">粗体 (Bold)</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="image-format-select">导出格式</label>
                <select id="image-format-select" class="form-select">
                  <option value="png" selected>PNG (无损透明)</option>
                  <option value="jpeg">JPEG (体积紧凑)</option>
                </select>
              </div>
            </div>

            <div style="margin-top: 10px; display: flex; gap: 16px; flex-wrap: wrap;">
              <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" id="auto-resize-check" checked /> 启用字号自动缩放 (防止出界)
              </label>
              <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" id="live-preview-check" checked /> 开启 60FPS 实时预览
              </label>
            </div>

            <div style="margin-top: 20px;">
              <button id="btn-generate-api" class="btn btn-primary" style="width: 100%; padding: 12px;">
                <span>⚡ 调用 API 生成高质量成品</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Preview Column -->
        <div class="preview-panel">
          <div class="card preview-card">
            <div class="preview-header">
              <h2 class="card-title" style="margin: 0;"><span>🖼️</span> 表情包预览</h2>
              <div class="preview-badges">
                <span id="badge-engine" class="badge badge-accent">
                  <span style="color: #38bdf8; font-weight: 600;">⚡ 纯前端 (0ms)</span>
                </span>
                <span id="badge-duration" class="badge">0.0ms</span>
              </div>
            </div>

            <!-- Preview Canvas / Image Stage -->
            <div class="preview-container" id="preview-container">
              <canvas id="preview-canvas" style="display: none;"></canvas>
              <img id="preview-image" alt="生成的表情包" style="display: none;" />
              
              <div id="preview-placeholder" class="preview-placeholder">
                <p style="font-size: 32px; margin-bottom: 8px;">🎨</p>
                <p>请选择贴纸包与贴纸开始制作</p>
              </div>

              <!-- Loading Overlay -->
              <div id="preview-loading" class="preview-loading" style="display: none;">
                <div class="spinner"></div>
                <p style="margin-top: 12px; font-size: 13px; color: #fff;">正在由渲染服务生成...</p>
              </div>
            </div>

            <div class="meta-tags" id="meta-tags-box" style="display: none;">
              <span id="badge-pack" class="badge"></span>
              <span id="badge-size" class="badge"></span>
              <span id="badge-filesize" class="badge"></span>
            </div>

            <div class="preview-actions">
              <button id="btn-copy" class="btn btn-primary" style="flex: 1;" disabled>
                <span>📋 复制到剪贴板</span>
              </button>
              <button id="btn-download" class="btn btn-secondary" style="flex: 1;" disabled>
                <span>💾 下载图片</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
